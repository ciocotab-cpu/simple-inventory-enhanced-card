stages:
  - validate

hacs_validation:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install hacs-frontend-linter || true
    - echo "Validazione hacs.json..."
    - python -m json.tool hacs.json
    - echo "Verifica presenza cartella dist..."
    - test -d dist
    - echo "Verifica presenza file principale..."
    - test -f dist/simple-inventory-enhanced-card.js
  only:
    - main
    - tags